name: Daily Python Publisher

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Publish next 2 Python files
        shell: bash
        run: |
          mkdir -p published

          FILES=$(find source -maxdepth 1 -type f -name "*.py" | sort | head -n 2)

          if [ -z "$FILES" ]; then
            echo "No Python files remaining."
            exit 0
          fi

          echo "Files scheduled for publishing:"

          while IFS= read -r FILE; do
            BASENAME=$(basename "$FILE")

            cp "$FILE" "published/$BASENAME"
            rm "$FILE"

            echo "Published: $BASENAME"
          done <<< "$FILES"

          echo "Remaining files:"
          find source -maxdepth 1 -type f -name "*.py" | sort | wc -l